# CI gate: run the test suite on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (sounddevice imports it at module load)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Run the eval oracle (gated — fails below targets)
        run: uv run python -m eval.run_eval
