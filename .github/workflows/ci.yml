# CI gate: run the test suite on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (sounddevice imports it at module load)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Run the eval oracle (gated — fails below targets)
        run: uv run python -m eval.run_eval

      - name: Build the native Auto test tools
        run: |
          cmake -S native/pocket -B native/pocket/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/pocket/build --parallel

      - name: Verify causal Auto on reserved vocal attacks
        run: uv run python -m eval.test_native_auto

      - name: Verify full real takes, capture timing and causality
        run: uv run python -m eval.test_real_auto --build native/pocket/build --report native/pocket/build/real-takes.json

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-real-take-regression
          path: native/pocket/build/real-takes.json
